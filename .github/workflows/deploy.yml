name: Build and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        required: true
        type: environment

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  CONTAINER_NAME: manager-easy-xray-api
  DEPLOY_DIRECTORY: /opt/manager-easy-xray-api

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      IMAGE: ${{ needs.build.outputs.image }}:sha-${{ github.sha }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - name: Validate environment secrets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Environment secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            IMAGE="$IMAGE" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            GHCR_USER="$GHCR_USER" \
            CONTAINER_NAME="$CONTAINER_NAME" \
            DEPLOY_DIRECTORY="$DEPLOY_DIRECTORY" \
            bash -s <<'REMOTE_SCRIPT'
          set -euo pipefail

          CONFIG_FILE="$DEPLOY_DIRECTORY/config.ini"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Missing server configuration: $CONFIG_FILE" >&2
            exit 1
          fi

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USER" \
            --password-stdin
          docker pull "$IMAGE"

          OLD_IMAGE="$(
            docker inspect --format '{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true
          )"

          run_container() {
            image="$1"
            docker run --detach \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --publish 443:443/tcp \
              --publish 8081:8081/tcp \
              --publish 9443:9443/tcp \
              --volume "$CONFIG_FILE:/fastapiapp/config.ini:ro" \
              "$image"
          }

          docker rm --force "$CONTAINER_NAME" 2>/dev/null || true
          run_container "$IMAGE"

          healthy=false
          for _ in $(seq 1 18); do
            status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
                "$CONTAINER_NAME"
            )"
            if [ "$status" = "healthy" ]; then
              healthy=true
              break
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 5
          done

          if [ "$healthy" != "true" ]; then
            docker logs "$CONTAINER_NAME" || true
            docker rm --force "$CONTAINER_NAME" || true

            if [ -n "$OLD_IMAGE" ]; then
              echo "Deployment failed, rolling back to $OLD_IMAGE" >&2
              run_container "$OLD_IMAGE"
            fi
            exit 1
          fi

          docker image prune --force
          REMOTE_SCRIPT
